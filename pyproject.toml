[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webhooklab"
version = "1.1.0"
description = "Local webhook delivery, replay, and observability lab."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Emmanuel Asika"}]
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.34.0", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.16.0"]

[project.scripts]
webhooklab = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

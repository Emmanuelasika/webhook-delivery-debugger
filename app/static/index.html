<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webhook Delivery Debugger — Delivery ledger</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#08111a;color:#e9f0f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px}h1{font-size:42px;margin:0}p{color:#9fb0c1;margin:8px 0}.badge{padding:7px 11px;background:#133149;color:#74c7ff;border:1px solid #24557a;border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.card{background:#0e1b27;border:1px solid #203345;border-radius:14px;padding:20px}.value{font-size:30px;font-weight:700;margin-top:8px}table{width:100%;border-collapse:collapse;background:#0e1b27;border:1px solid #203345;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:14px;border-bottom:1px solid #203345}th{color:#8fa3b7;font-size:12px;text-transform:uppercase}code{font-size:12px}.processed{color:#7ee2a8}.duplicate{color:#f6c177}.id_collision{color:#ff8e8e}@media(max-width:720px){header{display:block}.stats{grid-template-columns:1fr}table{font-size:12px}.hide-mobile{display:none}}</style></head><body><main class="wrap">
<header><div><h1>Webhook Delivery Debugger</h1><p>Signed delivery observability without retaining payload bodies.</p></div><span class="badge">live local ledger</span></header>
<section class="stats"><div class="card">Unique events<div class="value" id="events">—</div></div><div class="card">Delivery attempts<div class="value" id="attempts">—</div></div><div class="card">Duplicate rate<div class="value" id="rate">—</div></div></section>
<table><thead><tr><th>Event</th><th>Type</th><th>Outcome</th><th class="hide-mobile">HTTP</th><th>Received</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></main>
<script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [s,d]=await Promise.all([fetch('/api/stats'),fetch('/api/deliveries')]);const stats=await s.json(),data=await d.json();events.textContent=stats.unique_events;attempts.textContent=stats.delivery_attempts;rate.textContent=`${(stats.duplicate_rate*100).toFixed(1)}%`;rows.innerHTML=data.deliveries.length?data.deliveries.map(x=>`<tr><td><code>${esc(x.event_id)}</code></td><td>${esc(x.event_type)}</td><td class="${esc(x.outcome)}">${esc(x.outcome)}</td><td class="hide-mobile">${x.http_status}</td><td>${new Date(x.received_at).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="5">No deliveries yet. Use the CLI to send one.</td></tr>'}load();setInterval(load,3000)</script></body></html>
